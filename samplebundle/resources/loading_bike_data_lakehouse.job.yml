resources:
  jobs:
    loading_bike_data_lakehouse:
      name: loading_bike_data_lakehouse
      tasks:
        - task_key: Bronze_layer
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/loading_bike_data_lakehouse/Bronze_Script.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Silver_layer
          depends_on:
            - task_key: Bronze_layer
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/loading_bike_data_lakehouse/silver_orchestration.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Gold_layer
          depends_on:
            - task_key: Silver_layer
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/loading_bike_data_lakehouse/gold_orchestration.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: DAYS
      webhook_notifications: {}
